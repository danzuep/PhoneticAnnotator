name: Build USFM ruby asset

on:
  workflow_dispatch:
    inputs:
      usfm_url:
        description: USFM zip to download
        default: https://ebible.org/Scriptures/cmn-cu89t_usfm.zip
      language:
        description: Language code for the readings (zh-HK adds Jyutping)
        default: zh-HK
      release_tag:
        description: Release that receives the zip as an asset
        default: usfm-ruby

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      USFM_URL: ${{ inputs.usfm_url }}
      LANGUAGE: ${{ inputs.language }}
      TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Download USFM and add ruby
        run: |
          mkdir -p dist
          curl -fsSL "$USFM_URL" -o full.zip
          dotnet run -c Release --project src/PhoneticAnnotator.Cli -- \
            --data data/Unihan_Readings.txt --language "$LANGUAGE" \
            --usfm-in full.zip --usfm-out dist/usfm-ruby.zip
      - uses: actions/upload-artifact@v4
        with:
          name: usfm-ruby
          path: dist/usfm-ruby.zip
      - name: Publish release asset
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "USFM with ruby text" --prerelease
          gh release upload "$TAG" dist/usfm-ruby.zip --clobber
