name: Browser WebAssembly and Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Install native WASM tools
        run: dotnet workload install wasm-tools
      - name: Run managed tests
        run: dotnet test src/PhoneticAnnotator.Tests/PhoneticAnnotator.Tests.csproj -c Release
      - name: Publish AOT browser bundle
        run: dotnet publish src/PhoneticAnnotator.Wasm/PhoneticAnnotator.Wasm.csproj -c Release -f net10.0
      - name: Publish alternative NetWasm runtime and assemble static site
        run: |
          dotnet publish src/PhoneticAnnotator.NetWasm/PhoneticAnnotator.NetWasm.csproj -c Release -o artifacts/netwasm
          mkdir -p artifacts/site/PhoneticAnnotator/netwasm
          cp -a src/PhoneticAnnotator.Wasm/bin/Release/net10.0/publish/wwwroot/. artifacts/site/PhoneticAnnotator/
          cp -a artifacts/netwasm/browser artifacts/netwasm/index.html artifacts/netwasm/app.mjs artifacts/netwasm/main.js artifacts/netwasm/word-readings.tsv artifacts/netwasm/Unihan_Readings.txt artifacts/netwasm/THIRD-PARTY-NOTICES.txt artifacts/site/PhoneticAnnotator/netwasm/
      - name: Upload shared browser site
        uses: actions/upload-artifact@v4.6.2
        with:
          name: phoneticannotator-browser-site
          path: artifacts/site/
          if-no-files-found: error

  browser:
    needs: browser-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'
      - name: Download shared browser site
        uses: actions/download-artifact@v4.3.0
        with:
          name: phoneticannotator-browser-site
          path: artifacts/site/
      - name: Install browser checks
        working-directory: tools/browser-tests
        run: |
          dotnet tool install --global dotnet-serve --version 1.10.194
          npm ci
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Exercise both published runtimes under a project path
        working-directory: tools/browser-tests
        run: npm test -- --project=${{ matrix.browser }}
      - uses: actions/upload-pages-artifact@v3.0.1
        if: ((github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || github.event_name == 'workflow_dispatch') && matrix.browser == 'chromium'
        with:
          path: artifacts/site/PhoneticAnnotator
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: phoneticannotator-browser-${{ matrix.browser }}
          path: |
            artifacts/browser-results/
            artifacts/browser-report/

  pages:
    if: (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || github.event_name == 'workflow_dispatch'
    needs: browser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Check whether this run is still current
        id: current
        shell: bash
        run: |
          latest_sha="$(git ls-remote --refs origin "$GITHUB_REF" | cut -f1)"
          if [[ -z "$latest_sha" ]]; then
            echo "::error::Could not resolve the current $GITHUB_REF commit"
            exit 1
          fi
          if [[ "$latest_sha" == "$GITHUB_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping stale Pages deployment"
          fi
      - uses: actions/configure-pages@v5.0.0
        if: steps.current.outputs.deploy == 'true'
      - name: Deploy GitHub Pages
        id: deployment
        if: steps.current.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4.0.5
      - uses: actions/setup-node@v4.4.0
        if: steps.current.outputs.deploy == 'true'
        with:
          node-version: '24'
      - name: Verify both live Pages runtimes
        if: steps.current.outputs.deploy == 'true'
        working-directory: tools/browser-tests
        env:
          PHONETIC_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          npm ci
          npx playwright install --with-deps chromium
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 "$PHONETIC_BASE_URL" > /dev/null
          npm test -- --project=chromium
      - uses: actions/upload-artifact@v4.6.2
        if: always() && steps.current.outputs.deploy == 'true'
        with:
          name: phoneticannotator-live-pages
          path: artifacts/
